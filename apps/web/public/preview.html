<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>China Stroll · 移动端预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background:
        radial-gradient(1200px 700px at 50% -10%, #464c59, #20242d 55%, #12151c 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: auto;
    }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2c3038, #0b0d10);
      box-shadow:
        0 40px 90px rgba(0, 0, 0, .6),
        inset 0 0 0 2px #3a3f49,
        inset 0 0 0 6px #0b0d10;
    }
    .phone::before,
    .phone::after {
      content: "";
      position: absolute;
      left: -3px;
      width: 4px;
      border-radius: 3px;
      background: #2c3038;
    }
    .phone::before { top: 120px; height: 90px; }
    .phone::after { top: 230px; height: 60px; }
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
      background: #f5f1e8;
      display: flex;
      flex-direction: column;
    }
    .statusbar {
      flex: 0 0 auto;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: #0b0d10;
      color: #f5f1e8;
      font-size: 13px;
      font-weight: 600;
    }
    .statusbar .icons { letter-spacing: 1px; opacity: .9; }
    .notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 128px;
      height: 30px;
      border-radius: 16px;
      background: #000;
      z-index: 6;
      pointer-events: none;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: #f5f1e8;
    }
    .caption { color: #aab0bb; font-size: 13px; letter-spacing: .02em; }
    .caption strong { color: #e6e9ee; font-weight: 600; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="screen">
        <div class="notch"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">▲ ▮▮▮ 🔋</span>
        </div>
        <iframe src="/" title="China Stroll"></iframe>
      </div>
    </div>
    <div class="caption"><strong>China Stroll</strong> · 移动端预览 · 390 × 844</div>
  </div>
</body>
</html>
